<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Investor Controller — Stock Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090D18;
            --bg-card: rgba(22, 30, 50, 0.9);
            --border-card: rgba(255, 255, 255, 0.1);
            --accent-cyan: #38BDF8;
            --accent-green: #10B981;
            --accent-purple: #A855F7;
            --accent-red: #F87171;
            --accent-yellow: #FBBF24;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* Login Screen */
        .join-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .join-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .input-name {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 17px;
            font-family: inherit;
            font-weight: 600;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        .input-name:focus {
            border-color: var(--accent-cyan);
        }

        .btn-join {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            border: none;
            color: #080C16;
            font-family: inherit;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35);
        }

        /* Player In-Game View */
        .game-screen {
            display: none;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }

        .player-tag {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, rgba(20, 30, 55, 0.95), rgba(10, 16, 30, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 18px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .networth-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .networth-val {
            font-size: 34px;
            font-weight: 900;
            color: var(--accent-green);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .assets-split {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
            font-size: 13px;
        }

        .asset-item span {
            color: var(--text-secondary);
            display: block;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .asset-item strong {
            font-size: 15px;
            color: var(--text-primary);
        }

        /* Alert / Status pill */
        .status-alert {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--accent-yellow);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        /* Actions Container */
        .actions-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }

        .action-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-act {
            border: none;
            padding: 16px 14px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .btn-act:active {
            transform: scale(0.97);
        }

        .btn-buy {
            background: var(--accent-green);
            color: #080C16;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-sell {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.3);
        }

        .btn-hold {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 14px;
            font-size: 14px;
        }

        /* Quiz Controller */
        .quiz-controller {
            display: none;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            justify-content: center;
        }

        .quiz-btn {
            border: none;
            padding: 20px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 20px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s;
        }

        .quiz-btn:active {
            transform: scale(0.96);
        }

        .q-red { background: #DC2626; }
        .q-blue { background: #2563EB; }
        .q-green { background: #16A34A; }
        .q-yellow { background: #D97706; }
    </style>
</head>
<body>
    <!-- 1. Join Screen -->
    <div class="join-screen" id="joinScreen">
        <div class="join-card">
            <h2 style="font-size: 24px; font-weight: 800;">Join The Market</h2>
            <p style="font-size: 13.5px; color: var(--text-secondary);">Enter your name to receive your starting $100 cash:</p>
            <input type="text" id="nameInput" class="input-name" placeholder="Your Name" maxlength="15" autocomplete="off">
            <button class="btn-join" onclick="joinGame()">ENTER GAME 🚀</button>
        </div>
    </div>

    <!-- 2. Main Game Controller Screen -->
    <div class="game-screen" id="gameScreen">
        <div class="player-bar">
            <div class="player-tag" id="playerNameTag">Investor</div>
            <div class="price-badge" id="playerPriceBadge">Stock: $10.00</div>
        </div>

        <div class="balance-card">
            <div class="networth-label">Total Portfolio Net Worth</div>
            <div class="networth-val" id="myNetWorth">$100</div>
            <div class="assets-split">
                <div class="asset-item">
                    <span>Cash Available</span>
                    <strong id="myCash" style="color: var(--accent-cyan);">$100</strong>
                </div>
                <div class="asset-item" style="text-align: right;">
                    <span>Shares Owned</span>
                    <strong id="myShares" style="color: var(--accent-green);">0 slices</strong>
                </div>
            </div>
        </div>

        <div class="status-alert" id="statusMsg">
            Waiting for next market movement...
        </div>

        <!-- Trading Actions -->
        <div class="actions-panel" id="tradingActionsPanel">
            <div class="action-grid-2">
                <button class="btn-act btn-buy" onclick="buyShares(1)">
                    <span>BUY 1 SHARE</span>
                    <span style="font-size: 11px; opacity: 0.8;" id="buyCostLabel">Cost: $10</span>
                </button>
                <button class="btn-act btn-sell" onclick="sellShares(1)">
                    <span>SELL 1 SHARE</span>
                    <span style="font-size: 11px; opacity: 0.8;" id="sellRevLabel">Gain: $10</span>
                </button>
            </div>

            <div class="action-grid-2" style="margin-top: 4px;">
                <button class="btn-act btn-buy" style="background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); color: var(--accent-green);" onclick="buyMax()">
                    <span>BUY MAX</span>
                    <span style="font-size: 11px; opacity: 0.8;">All-in</span>
                </button>
                <button class="btn-act btn-sell" style="background: rgba(248, 113, 113, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red);" onclick="sellAll()">
                    <span>SELL ALL</span>
                    <span style="font-size: 11px; opacity: 0.8;">Liquidate</span>
                </button>
            </div>

            <button class="btn-act btn-hold" onclick="holdStrong()">
                HOLD STRONG (DO NOTHING)
            </button>
        </div>

        <!-- Quiz Actions -->
        <div class="quiz-controller" id="quizActionsPanel">
            <div style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 4px;">
                Look at the big screen & tap your answer:
            </div>
            <button class="quiz-btn q-red" onclick="sendQuizAnswer(0)">A</button>
            <button class="quiz-btn q-blue" onclick="sendQuizAnswer(1)">B</button>
            <button class="quiz-btn q-green" onclick="sendQuizAnswer(2)">C</button>
            <button class="quiz-btn q-yellow" onclick="sendQuizAnswer(3)">D</button>
        </div>
    </div>

    <script>
        let ws;
        let myData = { cash: 100, shares: 0 };
        let currentStockPrice = 10;
        let isQuizRound = false;

        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'JOIN_SUCCESS') {
                    myData = data.player;
                    document.getElementById('joinScreen').style.display = 'none';
                    document.getElementById('gameScreen').style.display = 'flex';
                    document.getElementById('playerNameTag').textContent = myData.name;
                    updateUI();
                }

                if (data.type === 'ACTION_RESULT') {
                    if (data.cash !== undefined) myData.cash = data.cash;
                    if (data.shares !== undefined) myData.shares = data.shares;
                    document.getElementById('statusMsg').textContent = data.message;
                    updateUI();
                }

                if (data.type === 'QUIZ_RESULT') {
                    document.getElementById('statusMsg').textContent = data.message;
                    updateUI();
                }

                if (data.type === 'STATE_UPDATE') {
                    currentStockPrice = data.state.stockPrice;

                    // Check if self is in players
                    if (myData.id) {
                        const me = data.state.players.find(p => p.id === myData.id);
                        if (me) {
                            myData.cash = me.cash;
                            myData.shares = me.shares;
                            myData.quizScore = me.quizScore;
                        }
                    }

                    isQuizRound = data.state.phase.startsWith('ROUND_5_QUIZ') || data.state.phase.startsWith('ROUND_6_QUIZ');

                    const tradingPanel = document.getElementById('tradingActionsPanel');
                    const quizPanel = document.getElementById('quizActionsPanel');

                    if (isQuizRound) {
                        tradingPanel.style.display = 'none';
                        quizPanel.style.display = 'flex';
                        document.getElementById('statusMsg').textContent = 'Speed Quiz Active! Tap your answer!';
                    } else if (data.state.phase === 'GAME_OVER') {
                        tradingPanel.style.display = 'none';
                        quizPanel.style.display = 'none';
                        document.getElementById('statusMsg').textContent = 'Game Over! Look at the big screen for winners!';
                    } else {
                        tradingPanel.style.display = 'flex';
                        quizPanel.style.display = 'none';
                        if (data.state.newsHeadline) {
                            document.getElementById('statusMsg').textContent = data.state.newsHeadline;
                        }
                    }

                    updateUI();
                }
            };

            ws.onclose = () => {
                setTimeout(connectWS, 2000);
            };
        }

        function updateUI() {
            const netWorth = myData.cash + (myData.shares * currentStockPrice) + (myData.quizScore || 0);
            document.getElementById('myNetWorth').textContent = `$${netWorth.toLocaleString()}`;
            document.getElementById('myCash').textContent = `$${myData.cash.toLocaleString()}`;
            document.getElementById('myShares').textContent = `${myData.shares} shares`;
            document.getElementById('playerPriceBadge').textContent = `Stock: $${currentStockPrice.toFixed(2)}`;
            document.getElementById('buyCostLabel').textContent = `Cost: $${currentStockPrice}`;
            document.getElementById('sellRevLabel').textContent = `Gain: $${currentStockPrice}`;
        }

        function joinGame() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Please enter your name!');
                return;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'PLAYER_JOIN', name }));
            }
        }

        function buyShares(amt) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'PLAYER_BUY', amount: amt }));
            }
        }

        function buyMax() {
            const max = Math.floor(myData.cash / currentStockPrice);
            if (max > 0) {
                buyShares(max);
            } else {
                alert('Not enough cash to buy even 1 share!');
            }
        }

        function sellShares(amt) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'PLAYER_SELL', amount: amt }));
            }
        }

        function sellAll() {
            if (myData.shares > 0) {
                sellShares(myData.shares);
            } else {
                alert('You have 0 shares to sell!');
            }
        }

        function holdStrong() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'PLAYER_HOLD' }));
            }
        }

        function sendQuizAnswer(ansIdx) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'PLAYER_QUIZ_ANSWER', answer: ansIdx }));
            }
        }

        // Enter key to join
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinGame();
        });

        connectWS();
    </script>
</body>
</html>
